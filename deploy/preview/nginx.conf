# Serves https://<short-sha>.preview.bololoo.com from /srv/previews/<short-sha>,
# and the live site (lingo.bololoo.com) from /srv/lingo-prod/current (a link to the active release),
# with /content/ (the word bank) from /srv/lingo-prod/content when it has been published there.
# The reverse proxy terminates TLS and forwards requests here with the original
# Host header.

# Security headers for every response. nginx drops server-level add_header
# lines inside a location that has its own, so each location repeats them via
# the variable below.
#   - The page may only run its own scripts. Pack text is shown as plain text
#     anyway; this is a second wall if a rendering bug ever let HTML through.
#   - api.github.com is for /admin publishing; Google Fonts for the typefaces.
#   - Inline styles are allowed because React and Headless UI set them.
map $host $lingo_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80 default_server;
    return 404;
}

server {
    listen 80;
    server_name "~^(?<preview>[a-f0-9]{7,40})\.preview\.bololoo\.com$";

    root /srv/previews/$preview;
    index index.html;

    # Previews must stay out of search results. Repeated per location because
    # add_header inside a location replaces the server-level ones.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Recorded voice clips are only published for the live site; previews use
    # the same ones (texts without a clip fall back to the browser voice).
    location /content/audio/ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /srv/lingo-prod;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/content/audio/.+\.mp3$ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /srv/lingo-prod;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Hashed build output never changes for a given file name.
    location /assets/ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker and manifest must be revalidated so updates are picked up.
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.(json|webmanifest))$ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html for React Router.
    location / {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html =404;
    }
}

# Live site. Same rules as previews, but indexable.
server {
    listen 80;
    server_name lingo.bololoo.com;

    root /srv/lingo-prod/current;
    index index.html;

    # Word bank: the copy put there by the "Content publish" workflow, or the
    # live release's own copy if nothing has been published yet.
    location /content/ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        root /srv/lingo-prod;
        add_header Cache-Control "no-cache" always;
        try_files $uri /current$uri =404;
    }

    # A voice clip's file never changes (a new voice gets a new folder).
    location ~ ^/content/audio/.+\.mp3$ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        root /srv/lingo-prod;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.(json|webmanifest))$ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # OAuth discovery for AI connectors (claude.ai's) using the API's MCP
    # endpoint. Clients look for these at the site root, which the API can't
    # serve, so they are copies of what server/src/mcp/oauth.js gives at
    # /api/oauth/metadata and /api/oauth/protected-resource(/me); a server test
    # keeps them equal. Exact matches, so other /.well-known/ paths still 404.
    location ~ ^/\.well-known/(oauth-authorization-server|openid-configuration)$ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        return 200 '{"issuer":"https://lingo.bololoo.com","authorization_endpoint":"https://lingo.bololoo.com/api/oauth/authorize","token_endpoint":"https://lingo.bololoo.com/api/oauth/token","registration_endpoint":"https://lingo.bololoo.com/api/oauth/register","response_types_supported":["code"],"grant_types_supported":["authorization_code","refresh_token"],"code_challenge_methods_supported":["S256"],"token_endpoint_auth_methods_supported":["none","client_secret_post","client_secret_basic"],"scopes_supported":["admin","learner"],"authorization_response_iss_parameter_supported":true}';
    }

    location ~ ^/\.well-known/oauth-protected-resource(/api/mcp)?$ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        return 200 '{"resource":"https://lingo.bololoo.com/api/mcp","authorization_servers":["https://lingo.bololoo.com"],"scopes_supported":["admin"],"bearer_methods_supported":["header"],"resource_name":"Lingo admin"}';
    }

    location ~ ^/\.well-known/oauth-protected-resource/api/mcp/me$ {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/json;
        return 200 '{"resource":"https://lingo.bololoo.com/api/mcp/me","authorization_servers":["https://lingo.bololoo.com"],"scopes_supported":["learner"],"bearer_methods_supported":["header"],"resource_name":"Lingo: my progress"}';
    }

    location / {
        add_header Content-Security-Policy $lingo_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html =404;
    }
}
