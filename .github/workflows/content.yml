# Puts the word base (github.com/amahlaka/lingo-wordbase) on the live site
# without a new app release.
#
# The words live in their own repository, so an admin's token can change words
# but never this app or its workflows. This workflow lives here, next to the
# deploy secrets, and checks the word base every 10 minutes; it publishes
# only when the word base's master has moved since the last publish. Run it by
# hand (Actions > "Content publish") to publish at once.
#
# Files go to content/ next to the releases; nginx serves /content/ from there
# and falls back to the copy inside the live release.

name: Content publish

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the live site already has the newest words
        type: boolean
        default: false

permissions:
  contents: read

env:
  WORDBASE_REPO: amahlaka/lingo-wordbase
  URL: ${{ vars.PRODUCTION_URL || 'https://lingo.bololoo.com' }}

jobs:
  # Cheap check with no secrets and no environment, so quiet runs don't create
  # deployments or ask for approval.
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.compare.outputs.sha }}
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - id: compare
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          sha=$(git ls-remote "https://github.com/$WORDBASE_REPO" refs/heads/master | cut -f1)
          live=$(curl -fsS "$URL/content/version.json" 2>/dev/null | sed -n 's/.*"sha": *"\([0-9a-f]*\)".*/\1/p' || true)
          echo "Word base master: $sha, live: ${live:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$sha" ] && { [ "$sha" != "$live" ] || [ "$FORCE" = "true" ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Recorded speech for new texts, made with an open voice model on the
  # runners' CPUs (scripts/speech-audio.mjs and .py), split over four runners.
  # Only texts without a clip on the live site are made, so after the first
  # run this takes a minute. No secrets here; the clips go to the publish job
  # as artifacts. If this fails, the words are still published and new texts
  # use the browser voice.
  audio:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.WORDBASE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          path: content
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - id: plan
        run: |
          node scripts/speech-audio.mjs plan --live "$URL"
          echo "count=$(node -p 'require("./audio-build/todo.json").items.length')" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.count != '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Kokoro v1.0 (Apache-2.0) as ONNX, from the kokoro-onnx project's release.
      # Downloaded each time rather than cached: this job has the word base
      # checked out, and nothing from it may reach a cache shared with master.
      - if: steps.plan.outputs.count != '0'
        run: |
          mkdir -p ~/kokoro && cd ~/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSLO "$base/kokoro-v1.0.onnx"
          curl -fsSLO "$base/voices-v1.0.bin"
          sha256sum -c - <<'SUMS'
          7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx
          bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin
          SUMS

      - if: steps.plan.outputs.count != '0'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
          python -m pip install --quiet kokoro-onnx==0.6.1 soundfile==0.14.0
          python scripts/speech-audio.py audio-build/todo.json --model ~/kokoro --shard "$SHARD/4"

      - if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: speech-audio-${{ matrix.shard }}
          path: audio-build/*/*.mp3
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: [check, audio]
    # Publish the words even if making clips failed.
    if: ${{ !cancelled() && needs.check.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://lingo.bololoo.com' }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # The checker comes from this repository's master, never from the word base.
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.WORDBASE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          path: content
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # New clips from the audio job, if it made any, and the list of every
      # clip the site will have. Skipped (keeping the live list) if anything
      # here fails.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: speech-audio-*
          merge-multiple: true
          path: audio-build

      - name: List the voice clips
        continue-on-error: true
        run: |
          node scripts/speech-audio.mjs finish --live "$URL"
          mkdir -p content/audio
          cp -r audio-build/. content/audio/

      # Plain Node, no install needed. Stops here if anything is wrong, so the
      # live site keeps the last good words.
      - run: node scripts/check-content.mjs

      - name: Upload the content
        env:
          SHA: ${{ needs.check.outputs.sha }}
          SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_PORT: ${{ vars.PROD_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          printf '{ "sha": "%s" }\n' "$SHA" > content/version.json
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_cmd="ssh -p $SSH_PORT -i ~/.ssh/prod_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # Paths are relative to the production folder (the key is restricted
          # with rrsync). Voice clips first: a clip's file never changes, and
          # older ones stay for visitors still on the old list.
          if [ -d content/audio ]; then
            rsync -rlz --mkpath --ignore-existing --chmod=D755,F644 \
              --include='*/' --include='*.mp3' --exclude='*' \
              -e "$ssh_cmd" content/audio/ "$SSH_USER@$SSH_HOST:content/audio/"
          fi
          # Then JSON (with audio/index.json). Packs first, index.json and
          # version.json last, so a visitor never gets an index naming a pack
          # that isn't there yet.
          rsync -rlz --mkpath --chmod=D755,F644 \
            --exclude=/index.json --exclude=/version.json --exclude='.*' \
            --include='*/' --include='*.json' --exclude='*' \
            -e "$ssh_cmd" content/ "$SSH_USER@$SSH_HOST:content/"
          rsync -z --chmod=F644 -e "$ssh_cmd" content/index.json content/version.json "$SSH_USER@$SSH_HOST:content/"
          rm -f ~/.ssh/prod_key

      - name: Check the live site serves it
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --compressed "$URL/content/index.json" | cmp -s - content/index.json; then
              echo "Live at $URL/content/"; exit 0
            fi
            sleep 3
          done
          echo "::warning::Uploaded, but $URL/content/index.json is not the new file. Check the /content/ location in the nginx config."

      - name: Summary
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          echo "### Published the word base at ${SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const i=require("./content/index.json");console.log(`Packs: ${i.packs.join(", ")}`)' >> "$GITHUB_STEP_SUMMARY"
